name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"
  # vnstock/vnai quarantined on PyPI — vendor index required for `pip install -e .`
  PIP_EXTRA_INDEX_URL: https://vnstocks.com/api/simple

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/
      - name: Check formatting with black
        run: black --check src/

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: |
          pytest src/tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY2: ${{ secrets.NVIDIA_API_KEY2 }}
          NVIDIA_API_KEY3: ${{ secrets.NVIDIA_API_KEY3 }}
          NVIDIA_CHAT_MODEL: ${{ secrets.NVIDIA_CHAT_MODEL }}
          NVIDIA_EMBEDDING_MODEL: ${{ secrets.NVIDIA_EMBEDDING_MODEL }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
      - name: Validate curriculum coverage and frontend export
        run: |
          python scripts/sync_learning_catalog.py --check
          python evals/run_curriculum_eval.py --validate-only
          python evals/run_curriculum_eval.py --track market_literacy --validate-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
