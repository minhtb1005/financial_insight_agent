services:
  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: finsight-mcp-dev
    ports:
      - "${MCP_EXTERNAL_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # Force the qdrant service (code priority PATH > URL > HOST/PORT).
      - QDRANT_PATH=
      - QDRANT_URL=
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      # Sentiment runs here too (tools/portfolio.py) — keep in sync with backend.
      - SENTIMENT_ENGINE=${SENTIMENT_ENGINE:-llm}
    volumes:
      - ./src:/app/src:cached
      - /app/src/__pycache__
      - app_data_dev:/app/data
    command: python -m mcp_server.server --transport streamable-http --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 10 -X POST http://localhost:8001/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"hc\",\"version\":\"0\"}}}'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - finsight-network

  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres-dev
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-finsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-finsight}
      - POSTGRES_DB=${POSTGRES_DB:-finsight}
    volumes:
      - postgres_storage_dev:/var/lib/postgresql/data
    networks:
      - finsight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight} -d ${POSTGRES_DB:-finsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: finsight-backend-dev
    ports:
      - "${APP_EXTERNAL_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - APP_PORT=${APP_PORT:-8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_KEY2=${NVIDIA_API_KEY2:-}
      - NVIDIA_API_KEY3=${NVIDIA_API_KEY3:-}
      - NVIDIA_CHAT_MODEL=${NVIDIA_CHAT_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      - NVIDIA_EMBEDDING_MODEL=${NVIDIA_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - ENABLE_RAG_SCHEDULER=${ENABLE_RAG_SCHEDULER:-true}
      - ENABLE_RATES_SCHEDULER=${ENABLE_RATES_SCHEDULER:-true}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # "hf" needs transformers (not in base deps) — use llm in Docker.
      - SENTIMENT_ENGINE=${SENTIMENT_ENGINE:-llm}
      - MCP_URL=http://mcp_server:8001/mcp
      - MCP_TRANSPORT=streamable-http
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_PATH=
      - QDRANT_URL=
      - ENABLE_MARKET_SCHEDULER=${ENABLE_MARKET_SCHEDULER:-false}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@postgres:5432/${POSTGRES_DB:-finsight}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@postgres:5432/${POSTGRES_DB:-finsight}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@finsight.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
    volumes:
      - ./src:/app/src:cached
      - ./alembic:/app/alembic:cached
      - ./alembic.ini:/app/alembic.ini:cached
      - app_data_dev:/app/data
      - /app/src/__pycache__
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold boot imports the app stack (NVIDIA-only, no torch) — first start
      # can still exceed 2 minutes.
      start_period: 240s
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - finsight-network

  frontend:
    image: node:20-alpine
    container_name: finsight-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-finsight-dev-secret-change-me-in-prod}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - API_URL=http://backend:${APP_PORT:-8000}
      - NEXT_PUBLIC_API_URL=http://localhost:${APP_EXTERNAL_PORT:-8000}
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - finsight-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finsight-qdrant-dev
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage_dev:/qdrant/storage
    networks:
      - finsight-network
    # NOTE: no healthcheck — qdrant image has no curl/wget (verified
    # 10/09/2026); nothing gates on qdrant health (service_started only).

networks:
  finsight-network:
    driver: bridge

volumes:
  qdrant_storage_dev:
  postgres_storage_dev:
  app_data_dev:
